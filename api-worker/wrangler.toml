name = "ne-giysem-api"
main = "src/index.ts"
compatibility_date = "2026-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGINS = "*"
FIREBASE_PROJECT_ID = "ne-giysem-ca404"
# FIREBASE_WEB_API_KEY is a secret (npx wrangler secret put FIREBASE_WEB_API_KEY); required for revocation checks.
REVENUECAT_ENTITLEMENT = "pro"
# Enable only on an isolated preview Worker for StoreKit / TestFlight sandbox tests.
REVENUECAT_ALLOW_SANDBOX = "false"
# Verified Firebase UIDs of designated App Review / TestFlight accounts only.
REVENUECAT_SANDBOX_USER_IDS = ""
AI_ENABLED = "true"
AI_MONTHLY_BUDGET_CENTS = "500"
# Global AI caps (whole deployment). Reservation is a conservative per-call cost estimate in cents.
AI_RESERVATION_CENTS = "1"
AI_DAILY_REQUEST_LIMIT = "500"
AI_MONTHLY_REQUEST_LIMIT = "1000"
# Per-user daily AI request limit.
AI_USER_DAILY_LIMIT = "25"
# Upload caps: global per day, per user per day, and global net bytes per calendar month (5 GiB).
UPLOAD_DAILY_GLOBAL_LIMIT = "1000"
UPLOAD_USER_DAILY_LIMIT = "10"
STORAGE_MONTHLY_BYTES_LIMIT = "5368709120"
# OpenAI model used for photo analysis and outfit chat.
OPENAI_MODEL = "gpt-6-luna"
# Firebase App Check (Worker side). FIREBASE_PROJECT_NUMBER is the numeric project number (Firebase console >
# Project settings). With APP_CHECK_ENFORCE = "false" tokens are verified when present and failures are only logged.
FIREBASE_PROJECT_NUMBER = "453039000570"
APP_CHECK_ENFORCE = "false"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "negiysem-storage"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# Secrets are added with:
# npx wrangler secret put OPENAI_API_KEY

[[durable_objects.bindings]]
name = "COST_GUARD"
class_name = "CostGuard"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CostGuard"]
